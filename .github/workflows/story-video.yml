name: Story video -> YouTube

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ dựng video (không upload, không xoá kịch bản)"
        type: boolean
        default: false
  schedule:
    # ======================================================================================
    # LỊCH ĐĂNG THEO TUẦN — 63 video/tuần (9 video/ngày, cả 7 ngày). Giờ UTC.
    # Mỗi lượt chạy SỚM ~37 PHÚT so với "giờ vàng" để bot kịp dựng + upload video.
    # Dùng phút :23 thay vì :30 vì GitHub hay trễ lịch 10–60 phút ở các phút tròn (:00, :30)
    # do quá nhiều workflow cùng đặt lịch -> phút lẻ giúp video lên đúng giờ vàng hơn.
    # Thứ trong cron là thứ theo giờ UTC: 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7.
    #
    # Thị trường ưu tiên (lượt xem hoạt hình tiếng Anh cho trẻ em nhiều nhất):
    #   Mỹ > Ấn Độ > Anh > Philippines > Canada > Úc > Pakistan / Nigeria / Malaysia / Singapore
    #
    # Giờ địa phương dưới đây tính theo giờ mùa hè (EDT/PDT/BST, AEDT). Khi Mỹ/Anh về giờ mùa đông
    # (Anh: 25/10, Mỹ: 01/11) giờ địa phương ở Mỹ/Anh sẽ SỚM hơn 1 tiếng — vẫn nằm trong khung vàng.
    # Mọi lượt cách nhau tối thiểu 2 tiếng để lượt trước xong trước khi lượt sau bắt đầu.
    #
    # Lưu ý quota YouTube API: mỗi lần upload ~1.600 đơn vị, mặc định 10.000 đơn vị/ngày/project.
    # 9 lượt/ngày cần đủ token (YT_MAX_NUM) trong tb_bao_secret để xoay vòng.
    # ======================================================================================

    # ---------- HẰNG NGÀY (cả 7 ngày) ----------

    # Giờ vàng 01:00 UTC -> chạy 00:23 UTC (tối hôm trước ở Mỹ)
    # = 6:00 PM Los Angeles / Vancouver (sau giờ học bờ Tây), 9:00 PM New York,
    #   12:00 PM Sydney (trưa hôm sau). = 08:00 sáng giờ Việt Nam.
    - cron: "23 0 * * *"

    # Giờ vàng 11:00 UTC -> chạy 10:23 UTC
    # = 4:30 PM Ấn Độ (vừa tan học), 7:00 PM Manila / Kuala Lumpur / Singapore (giờ gia đình),
    #   7:00 AM New York (trẻ mầm non xem buổi sáng; cuối tuần là giờ hoạt hình sáng).
    #   = 18:00 giờ Việt Nam.
    - cron: "23 10 * * *"

    # Giờ vàng 13:00 UTC -> chạy 12:23 UTC (trước chỉ T7, CN — nay mở rộng cả tuần)
    # = 6:30 PM Ấn Độ (giờ gia đình, thị trường số 2), 9:00 AM New York / Toronto
    #   (ngày thường: trẻ mầm non ở nhà; cuối tuần: giờ hoạt hình sáng — cao điểm lớn nhất tuần ở Mỹ),
    #   2:00 PM London. = 20:00 giờ Việt Nam.
    - cron: "23 12 * * *"

    # Giờ vàng 15:00 UTC -> chạy 14:23 UTC
    # = 4:00 PM London (tan học), 8:30 PM Ấn Độ, 4:00 PM Lagos, 11:00 AM New York (cuối tuần),
    #   8:00 AM Los Angeles (cuối tuần). = 22:00 giờ Việt Nam.
    - cron: "23 14 * * *"

    # Giờ vàng 17:00 UTC -> chạy 16:23 UTC (trước chỉ T6, T7, CN — nay mở rộng cả tuần)
    # = 6:00 PM London (tan học, sau bữa tối), 1:00 PM New York, 10:00 AM Los Angeles.
    #   = 00:00 giờ Việt Nam.
    - cron: "23 16 * * *"

    # Giờ vàng 23:00 UTC -> chạy 22:23 UTC
    # = 7:00 PM New York / Toronto (giờ trước khi ngủ, bố mẹ mở cho con xem),
    #   4:00 PM Los Angeles (tan học bờ Tây), 10:00 AM Sydney hôm sau. = 06:00 sáng giờ Việt Nam.
    - cron: "23 22 * * *"

    # ---------- NGÀY THƯỜNG (T2–T6) ----------

    # Giờ vàng 08:00 UTC -> chạy 07:23 UTC
    # = 7:00 PM Sydney / Melbourne, 9:00 PM Auckland, 4:00 PM Manila / Singapore (tan học),
    #   1:30 PM Ấn Độ. = 15:00 giờ Việt Nam.
    - cron: "23 7 * * 1-5"

    # Giờ vàng 19:00 UTC -> chạy 18:23 UTC
    # = 3:00 PM New York / Toronto (vừa tan học bờ Đông Mỹ & Canada), 12:00 PM Los Angeles,
    #   8:00 PM London. = 02:00 sáng giờ Việt Nam.
    - cron: "23 18 * * 1-5"

    # Giờ vàng 21:00 UTC -> chạy 20:23 UTC
    # = 5:00 PM New York / Toronto (khung xem nhiều nhất sau giờ học), 2:00 PM Los Angeles.
    #   = 04:00 sáng giờ Việt Nam.
    - cron: "23 20 * * 1-5"

    # ---------- CUỐI TUẦN (T7, CN) ----------

    # Giờ vàng 07:00 UTC -> chạy 06:23 UTC
    # = 8:00 AM London (sáng cuối tuần), 6:00 PM Sydney, 3:00 PM Manila, 12:30 PM Ấn Độ.
    #   = 14:00 giờ Việt Nam.
    - cron: "23 6 * * 0,6"

    # Giờ vàng 09:00 UTC -> chạy 08:23 UTC
    # = 10:00 AM London, 2:30 PM Ấn Độ, 5:00 PM Manila / Singapore, 8:00 PM Sydney,
    #   10:00 AM Lagos. = 16:00 giờ Việt Nam.
    - cron: "23 8 * * 0,6"

    # Giờ vàng 20:00 UTC -> chạy 19:23 UTC
    # = 4:00 PM New York, 1:00 PM Los Angeles (chiều cuối tuần ở nhà), 9:00 PM London.
    #   = 03:00 sáng giờ Việt Nam.
    - cron: "23 19 * * 0,6"

# Chỉ 1 lượt chạy tại 1 thời điểm. Lưu ý: GitHub chỉ giữ tối đa 1 lượt chờ — nếu 1 lượt dựng
# lâu hơn 2 tiếng, lượt chờ cũ sẽ bị thay bằng lượt mới hơn (mất 1 video).
concurrency:
  group: story-video
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Cài ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font cho phụ đề
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra công cụ
        run: |
          node -v
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Dựng video và upload YouTube
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          # YouTube client_id / client_secret / refresh_token được đọc từ bảng tb_bao_secret trên MySQL.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          YT_SECRET_TABLE: tb_bao_secret
          YT_TOKEN_COLUMN: token_kid
          YT_MAX_NUM: "9"
          STORY_DIR: ${{ secrets.STORY_DIR }}
          MUSIC_DIR: ${{ secrets.MUSIC_DIR }}
          MP3_DIR: ${{ secrets.MP3_DIR }}
          VIDEO_WIDTH: "2560"
          VIDEO_HEIGHT: "1440"
          VIDEO_FPS: "30"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.mjs

      - name: Lưu video thử (DRY_RUN)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-dry-run
          path: |
            bot/output.mp4
            bot/thumbnail.jpg
            bot/short.mp4
          retention-days: 3
