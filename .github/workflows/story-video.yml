name: Story video -> YouTube

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ dựng video (không upload, không xoá kịch bản)"
        type: boolean
        default: false
  schedule:
    # Mỗi ngày 3 lần = 3 kịch bản = 3 video, nhắm 3 khung giờ vàng của trẻ em nói tiếng Anh. Giờ UTC.
    # Đăng ~1-2 giờ TRƯỚC giờ cao điểm để YouTube kịp xử lý HD/4K và đẩy đề xuất khi trẻ bắt đầu xem.
    # Phút 07 để tránh tắc nghẽn đầu giờ của GitHub (lịch đúng :00 hay bị trễ).

    # Mốc 1 - Úc / New Zealand / Philippines / Singapore / Ấn Độ (sau giờ học):
    # 07:07 UTC = 5:07 PM Sydney (AEST) / 6:07 PM (AEDT), 7:07 PM Auckland, 3:07 PM Manila & Singapore,
    # 12:37 PM Ấn Độ, 8:07 AM London (cuối tuần trẻ Anh xem buổi sáng). = 14:07 giờ Việt Nam.
    - cron: "7 7 * * *"

    # Mốc 2 - Mỹ bờ Đông + Anh/châu Âu:
    # 18:07 UTC = 2:07 PM New York (EDT) / 1:07 PM EST, 11:07 AM Los Angeles, 7:07 PM London,
    # tức ~1-2 giờ trước khung giờ trẻ em Mỹ xem nhiều nhất sau giờ học (3-6 PM) và trước giờ tối châu Âu.
    # = 01:07 sáng giờ Việt Nam.
    - cron: "7 18 * * *"

    # Mốc 3 - Mỹ bờ Tây / Canada + giờ tối gia đình bờ Đông (trước giờ ngủ, bố mẹ mở cho con xem):
    # 22:07 UTC = 3:07 PM Los Angeles & Vancouver (PDT) / 2:07 PM PST, 6:07 PM New York (EDT),
    # 9:07 AM Sydney hôm sau (cuối tuần). = 05:07 sáng giờ Việt Nam.
    - cron: "7 22 * * *"

# Chỉ 1 lượt chạy tại 1 thời điểm (lượt sau phải chờ lượt trước xong) -> không bao giờ upload 2 video song song.
concurrency:
  group: story-video
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Cài ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font cho phụ đề
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra công cụ
        run: |
          node -v
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Dựng video và upload YouTube
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          # YouTube client_id / client_secret / refresh_token được đọc từ bảng tb_bao_secret trên MySQL.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          YT_SECRET_TABLE: tb_bao_secret
          YT_TOKEN_COLUMN: token_kid
          YT_MAX_NUM: "9"
          STORY_DIR: ${{ secrets.STORY_DIR }}
          MUSIC_DIR: ${{ secrets.MUSIC_DIR }}
          MP3_DIR: ${{ secrets.MP3_DIR }}
          VIDEO_WIDTH: "2560"
          VIDEO_HEIGHT: "1440"
          VIDEO_FPS: "30"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.mjs

      - name: Lưu video thử (DRY_RUN)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-dry-run
          path: |
            bot/output.mp4
            bot/thumbnail.jpg
          retention-days: 3
