name: Story video -> YouTube

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ dựng video (không upload, không xoá kịch bản)"
        type: boolean
        default: false
  schedule:
    # ======================================================================================
    # LỊCH ĐĂNG — 1 video/ngày, mỗi ngày đúng 1 lượt, bất kể thứ mấy. Giờ UTC.
    #
    # Khung giờ tối ưu nhất: 23:00 UTC
    #   • 6:00 PM New York / Toronto (giờ gia đình, trước giờ ngủ của trẻ)
    #   • 3:00 PM Los Angeles / Vancouver (vừa tan học bờ Tây)
    #   • 10:00 AM Sydney
    #   • = 06:00 sáng giờ VN
    #   Mỹ chiếm ~60% lượt xem nên đây là khung phủ được cả 2 bờ Mỹ cùng lúc.
    #
    # Chạy SỚM ~37 phút (22:23 UTC) để bot kịp dựng + upload trước giờ vàng.
    # Dùng phút :23 thay vì :00/:30 vì GitHub hay trễ lịch ở các phút tròn.
    # Giờ địa phương ghi theo giờ mùa đông; giờ mùa hè cộng 1 tiếng, vẫn trong khung vàng.
    # ======================================================================================
    - cron: "23 22 * * *"

concurrency:
  group: story-video
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Cài ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font cho phụ đề
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra công cụ
        run: |
          node -v
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Dựng video và upload YouTube
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          # YouTube client_id / client_secret / refresh_token được đọc từ bảng tb_bao_secret trên MySQL.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          YT_SECRET_TABLE: tb_bao_secret
          YT_TOKEN_COLUMN: token_kid
          YT_MAX_NUM: "9"
          STORY_DIR: ${{ secrets.STORY_DIR }}
          MUSIC_DIR: ${{ secrets.MUSIC_DIR }}
          MP3_DIR: ${{ secrets.MP3_DIR }}
          VIDEO_WIDTH: "2560"
          VIDEO_HEIGHT: "1440"
          VIDEO_FPS: "30"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.mjs

      - name: Lưu video thử (DRY_RUN)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-dry-run
          path: |
            bot/output.mp4
            bot/thumbnail.jpg
            bot/short.mp4
          retention-days: 3
