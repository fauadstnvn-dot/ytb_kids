name: Story video -> YouTube

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ dựng video (không upload, không xoá kịch bản)"
        type: boolean
        default: false
  schedule:
    # ======================================================================================
    # LỊCH ĐĂNG THEO TUẦN — 33 video/tuần. Giờ UTC.
    #   • Ngày thường (T2–T6 theo UTC): 3 video/ngày  -> 15 video, chỉ vào 3 khung vàng nhất.
    #   • Cuối tuần   (T7, CN theo UTC): 9 video/ngày -> 18 video, phủ kín các khung xem.
    #
    # Mỗi lượt chạy SỚM ~37 PHÚT so với "giờ vàng" để bot kịp dựng + upload video.
    # Dùng phút :23 thay vì :00/:30 vì GitHub hay trễ lịch 10–60 phút ở các phút tròn.
    # Thứ trong cron là thứ theo giờ UTC: 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7.
    #
    # Thị trường mục tiêu: TRẺ EM CÁC NƯỚC NÓI TIẾNG ANH BẢN NGỮ.
    #   Mỹ (~60% lượt xem, ưu tiên số 1) > Anh > Canada > Úc > Ireland / New Zealand
    #   Mỹ + Canada chung khung giờ (New York = Toronto, Los Angeles = Vancouver).
    #
    # Giờ địa phương ghi theo GIỜ MÙA ĐÔNG (EST/PST/GMT, áp dụng từ Anh 25/10, Mỹ 01/11 đến
    # tháng 3). Giờ mùa hè (EDT/PDT/BST) thì cộng thêm 1 tiếng — vẫn nằm trong khung vàng.
    # Úc ghi theo AEDT (giờ mùa hè Úc, tháng 10 -> tháng 4).
    # Mọi lượt cách nhau tối thiểu 2 tiếng để lượt trước xong trước khi lượt sau bắt đầu.
    #
    # Quota YouTube API: mỗi upload ~1.600 đơn vị, mặc định 10.000 đơn vị/ngày/project.
    # Cuối tuần 9 lượt/ngày -> cần đủ token (YT_MAX_NUM) trong tb_bao_secret để xoay vòng.
    # ======================================================================================

    # ---------- NGÀY THƯỜNG (T2–T6) — 3 khung vàng: giờ tan học & tối trước giờ ngủ ----------
    # 16:00 UTC (chạy 15:23) — ANH + IRELAND: 4:00 PM London / Dublin (vừa tan học). = 23:00 VN.
    # 21:00 UTC (chạy 20:23) — MỸ BỜ ĐÔNG + CANADA: 4:00 PM New York / Toronto (vừa tan học),
    #   1:00 PM Los Angeles, 9:00 PM London. = 04:00 VN.
    # 23:00 UTC (chạy 22:23) — MỸ CẢ 2 BỜ (khung mạnh nhất): 6:00 PM New York / Toronto
    #   (giờ gia đình, trước giờ ngủ), 3:00 PM Los Angeles / Vancouver (tan học bờ Tây),
    #   10:00 AM Sydney. = 06:00 VN.
    - cron: "23 15,20,22 * * 1-5"

    # ---------- CUỐI TUẦN (T7, CN) — 9 video, trẻ ở nhà cả ngày ----------
    # 01:00 UTC (00:23) — 8:00 PM New York, 5:00 PM Los Angeles, 12:00 PM Sydney. = 08:00 VN.
    # 08:00 UTC (07:23) — 8:00 AM London (sáng cuối tuần Anh), 7:00 PM Sydney, 9:00 PM Auckland. = 15:00 VN.
    # 10:00 UTC (09:23) — 10:00 AM London / Dublin (cao điểm sáng cuối tuần Anh). = 17:00 VN.
    # 12:00 UTC (11:23) — 7:00 AM New York (trẻ Mỹ dậy xem hoạt hình), 12:00 PM London. = 19:00 VN.
    # 14:00 UTC (13:23) — 9:00 AM New York / Toronto (CAO ĐIỂM LỚN NHẤT TUẦN ở Mỹ),
    #   6:00 AM Los Angeles, 2:00 PM London. = 21:00 VN.
    # 16:00 UTC (15:23) — 11:00 AM New York, 8:00 AM Los Angeles (sáng cuối tuần bờ Tây),
    #   4:00 PM London. = 23:00 VN.
    # 18:00 UTC (17:23) — 1:00 PM New York, 10:00 AM Los Angeles, 6:00 PM London. = 01:00 VN.
    # 20:00 UTC (19:23) — 3:00 PM New York, 12:00 PM Los Angeles, 7:00 AM Sydney. = 03:00 VN.
    # 23:00 UTC (22:23) — 6:00 PM New York / Toronto, 3:00 PM Los Angeles, 10:00 AM Sydney. = 06:00 VN.
    - cron: "23 0,7,9,11,13,15,17,19,22 * * 0,6"

# Chỉ 1 lượt chạy tại 1 thời điểm. Lưu ý: GitHub chỉ giữ tối đa 1 lượt chờ — nếu 1 lượt dựng
# lâu hơn 2 tiếng, lượt chờ cũ sẽ bị thay bằng lượt mới hơn (mất 1 video).
concurrency:
  group: story-video
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Cài ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font cho phụ đề
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra công cụ
        run: |
          node -v
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Dựng video và upload YouTube
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          # YouTube client_id / client_secret / refresh_token được đọc từ bảng tb_bao_secret trên MySQL.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          YT_SECRET_TABLE: tb_bao_secret
          YT_TOKEN_COLUMN: token_kid
          YT_MAX_NUM: "9"
          STORY_DIR: ${{ secrets.STORY_DIR }}
          MUSIC_DIR: ${{ secrets.MUSIC_DIR }}
          MP3_DIR: ${{ secrets.MP3_DIR }}
          VIDEO_WIDTH: "2560"
          VIDEO_HEIGHT: "1440"
          VIDEO_FPS: "30"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.mjs

      - name: Lưu video thử (DRY_RUN)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-dry-run
          path: |
            bot/output.mp4
            bot/thumbnail.jpg
            bot/short.mp4
          retention-days: 3
