name: Story video -> YouTube

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ dựng video (không upload, không xoá kịch bản)"
        type: boolean
        default: false
  schedule:
    # ======================================================================================
    # LỊCH ĐĂNG THEO TUẦN — 54 video/tuần (T2–T5: 7/ngày, T6: 8, T7: 9, CN: 9). Giờ UTC.
    # Mỗi lượt chạy SỚM 30 PHÚT so với "giờ vàng" để bot kịp dựng + upload video.
    # Thứ trong cron là thứ theo giờ UTC: 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7.
    #
    # Thị trường ưu tiên (lượt xem hoạt hình tiếng Anh cho trẻ em nhiều nhất):
    #   Mỹ > Ấn Độ > Anh > Philippines > Canada > Úc > Pakistan / Nigeria / Malaysia / Singapore
    #
    # Giờ địa phương dưới đây tính theo giờ mùa hè (EDT/PDT/BST, AEDT). Khi Mỹ/Anh về giờ mùa đông
    # (Anh: 25/10, Mỹ: 01/11) giờ địa phương ở Mỹ/Anh sẽ SỚM hơn 1 tiếng — vẫn nằm trong khung vàng.
    # Mọi lượt cách nhau tối thiểu 2 tiếng để lượt trước xong trước khi lượt sau bắt đầu.
    # ======================================================================================

    # ---------- HẰNG NGÀY (cả 7 ngày) ----------

    # Giờ vàng 01:00 UTC -> chạy 00:30 UTC (tối hôm trước ở Mỹ)
    # = 6:00 PM Los Angeles / Vancouver (sau giờ học bờ Tây), 9:00 PM New York,
    #   12:00 PM Sydney (trưa hôm sau). = 07:30 sáng giờ Việt Nam.
    - cron: "30 0 * * *"

    # Giờ vàng 11:00 UTC -> chạy 10:30 UTC
    # = 4:30 PM Ấn Độ (vừa tan học), 7:00 PM Manila / Kuala Lumpur / Singapore (giờ gia đình),
    #   7:00 AM New York (trẻ mầm non xem buổi sáng; cuối tuần là giờ hoạt hình sáng).
    #   = 17:30 giờ Việt Nam.
    - cron: "30 10 * * *"

    # Giờ vàng 15:00 UTC -> chạy 14:30 UTC
    # = 4:00 PM London (tan học), 8:30 PM Ấn Độ, 4:00 PM Lagos, 11:00 AM New York (cuối tuần),
    #   8:00 AM Los Angeles (cuối tuần). = 21:30 giờ Việt Nam.
    - cron: "30 14 * * *"

    # Giờ vàng 23:00 UTC -> chạy 22:30 UTC
    # = 7:00 PM New York / Toronto (giờ trước khi ngủ, bố mẹ mở cho con xem),
    #   4:00 PM Los Angeles (tan học bờ Tây), 10:00 AM Sydney hôm sau. = 05:30 sáng giờ Việt Nam.
    - cron: "30 22 * * *"

    # ---------- NGÀY THƯỜNG (T2–T6) ----------

    # Giờ vàng 08:00 UTC -> chạy 07:30 UTC
    # = 7:00 PM Sydney / Melbourne, 9:00 PM Auckland, 4:00 PM Manila / Singapore (tan học),
    #   1:30 PM Ấn Độ. = 14:30 giờ Việt Nam.
    - cron: "30 7 * * 1-5"

    # Giờ vàng 19:00 UTC -> chạy 18:30 UTC
    # = 3:00 PM New York / Toronto (vừa tan học bờ Đông Mỹ & Canada), 12:00 PM Los Angeles,
    #   8:00 PM London. = 01:30 sáng giờ Việt Nam.
    - cron: "30 18 * * 1-5"

    # Giờ vàng 21:00 UTC -> chạy 20:30 UTC
    # = 5:00 PM New York / Toronto (khung xem nhiều nhất sau giờ học), 2:00 PM Los Angeles.
    #   = 03:30 sáng giờ Việt Nam.
    - cron: "30 20 * * 1-5"

    # ---------- THÊM CHO T6, T7, CN ----------

    # Giờ vàng 17:00 UTC -> chạy 16:30 UTC
    # = 6:00 PM London (tối thứ Sáu / cuối tuần), 1:00 PM New York, 10:00 AM Los Angeles (sáng cuối tuần).
    #   = 23:30 giờ Việt Nam.
    - cron: "30 16 * * 0,5,6"

    # ---------- CUỐI TUẦN (T7, CN) ----------

    # Giờ vàng 07:00 UTC -> chạy 06:30 UTC
    # = 8:00 AM London (sáng cuối tuần), 6:00 PM Sydney, 3:00 PM Manila, 12:30 PM Ấn Độ.
    #   = 13:30 giờ Việt Nam.
    - cron: "30 6 * * 0,6"

    # Giờ vàng 09:00 UTC -> chạy 08:30 UTC
    # = 10:00 AM London, 2:30 PM Ấn Độ, 5:00 PM Manila / Singapore, 8:00 PM Sydney,
    #   10:00 AM Lagos. = 15:30 giờ Việt Nam.
    - cron: "30 8 * * 0,6"

    # Giờ vàng 13:00 UTC -> chạy 12:30 UTC
    # = 9:00 AM New York / Toronto (giờ hoạt hình sáng cuối tuần — cao điểm lớn nhất tuần ở Mỹ),
    #   2:00 PM London, 6:30 PM Ấn Độ. = 19:30 giờ Việt Nam.
    - cron: "30 12 * * 0,6"

    # Giờ vàng 20:00 UTC -> chạy 19:30 UTC
    # = 4:00 PM New York, 1:00 PM Los Angeles (chiều cuối tuần ở nhà), 9:00 PM London.
    #   = 02:30 sáng giờ Việt Nam.
    - cron: "30 19 * * 0,6"

# Chỉ 1 lượt chạy tại 1 thời điểm. Lưu ý: GitHub chỉ giữ tối đa 1 lượt chờ — nếu 1 lượt dựng
# lâu hơn 2 tiếng, lượt chờ cũ sẽ bị thay bằng lượt mới hơn (mất 1 video).
concurrency:
  group: story-video
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Cài ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font cho phụ đề
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra công cụ
        run: |
          node -v
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Dựng video và upload YouTube
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          # YouTube client_id / client_secret / refresh_token được đọc từ bảng tb_bao_secret trên MySQL.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          YT_SECRET_TABLE: tb_bao_secret
          YT_TOKEN_COLUMN: token_kid
          YT_MAX_NUM: "9"
          STORY_DIR: ${{ secrets.STORY_DIR }}
          MUSIC_DIR: ${{ secrets.MUSIC_DIR }}
          MP3_DIR: ${{ secrets.MP3_DIR }}
          VIDEO_WIDTH: "2560"
          VIDEO_HEIGHT: "1440"
          VIDEO_FPS: "30"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.mjs

      - name: Lưu video thử (DRY_RUN)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-dry-run
          path: |
            bot/output.mp4
            bot/thumbnail.jpg
            bot/short.mp4
          retention-days: 3
